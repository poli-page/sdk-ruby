name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:17 UTC — staggered off-the-hour to dodge
    # GH Actions scheduler peaks (per sdk-ruby-plan.md §16.6).
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

# All third-party Actions pinned to 40-char commit SHAs per
# sdk-ruby-plan.md §16.6.

jobs:
  analyze:
    name: Analyze (Ruby)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: ruby
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          category: "/language:ruby"
