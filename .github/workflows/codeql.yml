name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 06:17 UTC — staggered off-the-hour to dodge
    # GH Actions scheduler peaks (per sdk-ruby-plan.md §16.6).
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write

# All third-party Actions pinned to 40-char commit SHAs per
# sdk-ruby-plan.md §16.6.

jobs:
  analyze:
    name: Analyze (Ruby)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4
        with:
          languages: ruby
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dc73d59c2d7bd4f8194098a91219eeee6d8a1719 # v4
        with:
          category: "/language:ruby"
