name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# TODO(phase-1+): once `sig/*.rbs` files start landing, add the following steps to
# every matrix job (per sdk-ruby-plan.md §16.1):
#   - run: bundle exec rbs validate
#   - run: bundle exec steep check
#   - run: bundle exec yard --fail-on-warning
# TODO(phase-0 pre-flight): pin `ruby/setup-ruby` to a 40-char commit SHA
# (currently a floating tag) per sdk-ruby-plan.md §16.6 workflow hardening.

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        os: [ubuntu-latest]
        include:
          - ruby: "3.4"
            os: macos-latest
          - ruby: "3.4"
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Bundle install (frozen)
        run: bundle install --frozen

      - name: RuboCop
        run: bundle exec rubocop

      - name: RSpec (unit)
        run: bundle exec rspec spec

      - name: bundler-audit
        run: bundle exec bundle-audit check --update

      - name: Build gem
        run: gem build poli-page.gemspec

      - name: Consumer install smoke
        # Mirrors the Node SDK's install-smoke step (sdk-ruby-plan.md §16.1).
        # Installs the built .gem into an isolated location and requires it
        # from a fresh process to catch packaging regressions.
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/smoke"
          cd "${RUNNER_TEMP}/smoke"
          gem install "${GITHUB_WORKSPACE}"/poli-page-*.gem --no-document --install-dir "${RUNNER_TEMP}/smoke/.gems"
          GEM_PATH="${RUNNER_TEMP}/smoke/.gems" ruby -r poli_page -e 'puts PoliPage::VERSION'
