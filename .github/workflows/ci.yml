name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# All third-party Actions pinned to 40-char commit SHAs (supply-chain hardening).
# The trailing comment is the human-readable tag; bump SHA + tag together via Dependabot.

jobs:
  test:
    # id-token: write is for the Codecov OIDC upload in this job only.
    # contents: read is restated because a job-level block replaces the
    # workflow-level one.
    permissions:
      contents: read
      id-token: write
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        os: [ubuntu-latest]
        include:
          - ruby: "3.4"
            os: macos-latest
          - ruby: "3.4"
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Bundle install (frozen)
        run: |
          bundle config set --local frozen true
          bundle install

      - name: RuboCop
        run: bundle exec rubocop

      # Plain `rbs validate` loads no sig/ directory (no rbs_collection.yaml), so
      # it exits 0 even on a broken signature. -I sig loads this repo's
      # signatures; the -r libraries are the ones the Steepfile declares.
      - name: RBS validate
        run: bundle exec rbs -I sig -r json -r uri -r net-http -r openssl -r logger -r securerandom -r fileutils -r pathname -r cgi validate

      - name: YARD (fail on warning)
        run: bundle exec yard --fail-on-warning

      - name: API contract
        id: contract
        uses: poli-page/api-contract@1f705b3ce3e15ff56e2f7b8249c1a2983af2312c # v0.13.0

      - name: RSpec (unit + API contract)
        # spec/contract runs every SDK case of the pinned contract; with CI set
        # and no POLI_CONTRACT, it fails instead of skipping.
        run: bundle exec rspec spec
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}

      - name: Upload coverage to Codecov
        # Only upload once per CI run — the matrix would otherwise upload the
        # same report 5×. Tokenless: Codecov uses the GitHub OIDC token for
        # public-repo uploads, so no CODECOV_TOKEN secret is required.
        if: matrix.ruby == '3.4' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

      - name: bundler-audit
        run: bundle exec bundle-audit check --update

      - name: Build gem
        run: gem build poli-page.gemspec

      - name: Consumer install smoke
        # Mirrors the Node SDK's install-smoke step.
        # Installs the built .gem into an isolated location and requires it
        # from a fresh process to catch packaging regressions.
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/smoke"
          cd "${RUNNER_TEMP}/smoke"
          gem install "${GITHUB_WORKSPACE}"/poli-page-*.gem --no-document --install-dir "${RUNNER_TEMP}/smoke/.gems"
          GEM_PATH="${RUNNER_TEMP}/smoke/.gems" ruby -r poli_page -e 'puts PoliPage::VERSION'

  steep:
    name: Steep (type check)
    runs-on: ubuntu-latest
    # Steep runs separately from the test matrix: it's Ruby-version-agnostic
    # and isolating it makes the failure cause obvious. Configured with
    # `--severity-level=error` so internal-namespace untyped calls (Steep
    # surfaces these as `warning`) don't fail the build — only actionable
    # type errors do.
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Bundle install (frozen)
        run: |
          bundle config set --local frozen true
          bundle install

      - name: Steep check (severity=error)
        run: bundle exec steep check --severity-level=error

  # One check that sums up the PR jobs: the name the `main` ruleset requires for merges
  # (the aggregate gate the branch ruleset requires for merges).
  ci:
    if: always()
    needs: [test, steep]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
      - run: test "${{ needs.steep.result }}" = success
