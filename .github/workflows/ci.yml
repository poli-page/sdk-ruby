name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Required by the Codecov uploader (use_oidc: true) so it can mint a
  # short-lived OIDC token instead of relying on a CODECOV_TOKEN secret.
  id-token: write

# All third-party Actions pinned to 40-char commit SHAs per
# sdk-ruby-plan.md §16.6 (supply-chain hardening). The trailing comment
# is the human-readable tag; bump SHA + tag together via Dependabot.

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
        os: [ubuntu-latest]
        include:
          - ruby: "3.4"
            os: macos-latest
          - ruby: "3.4"
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Bundle install (frozen)
        run: |
          bundle config set --local frozen true
          bundle install

      - name: RuboCop
        run: bundle exec rubocop

      - name: RBS validate
        run: bundle exec rbs validate

      - name: YARD (fail on warning)
        run: bundle exec yard --fail-on-warning

      - name: RSpec (unit)
        run: bundle exec rspec spec

      - name: Upload coverage to Codecov
        # Only upload once per CI run — the matrix would otherwise upload the
        # same report 5×. Tokenless: Codecov uses the GitHub OIDC token for
        # public-repo uploads, so no CODECOV_TOKEN secret is required.
        if: matrix.ruby == '3.4' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

      - name: bundler-audit
        run: bundle exec bundle-audit check --update

      - name: Build gem
        run: gem build poli-page.gemspec

      - name: Consumer install smoke
        # Mirrors the Node SDK's install-smoke step (sdk-ruby-plan.md §16.1).
        # Installs the built .gem into an isolated location and requires it
        # from a fresh process to catch packaging regressions.
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/smoke"
          cd "${RUNNER_TEMP}/smoke"
          gem install "${GITHUB_WORKSPACE}"/poli-page-*.gem --no-document --install-dir "${RUNNER_TEMP}/smoke/.gems"
          GEM_PATH="${RUNNER_TEMP}/smoke/.gems" ruby -r poli_page -e 'puts PoliPage::VERSION'

  steep:
    name: Steep (type check)
    runs-on: ubuntu-latest
    # Steep runs separately from the test matrix: it's Ruby-version-agnostic
    # and isolating it makes the failure cause obvious. Configured with
    # `--severity-level=error` so internal-namespace untyped calls (Steep
    # surfaces these as `warning`) don't fail the build — only actionable
    # type errors do (sdk-ruby-plan.md §9.3).
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Bundle install (frozen)
        run: |
          bundle config set --local frozen true
          bundle install

      - name: Steep check (severity=error)
        run: bundle exec steep check --severity-level=error
