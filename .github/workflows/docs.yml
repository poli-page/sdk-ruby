name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Pages deploy needs `pages: write` and OIDC `id-token: write`.
# `contents: read` is the only repo permission required (per plan §16.6).
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deploys; queue the latest commit and cancel
# in-flight runs so `main` always reflects HEAD on Pages.
concurrency:
  group: pages
  cancel-in-progress: true

# All third-party Actions pinned to 40-char commit SHAs per
# sdk-ruby-plan.md §16.6.

jobs:
  build:
    name: Build YARD
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651 # v1.245.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build YARD (fail on warning)
        run: bundle exec yard --fail-on-warning

      - name: Configure Pages
        # One-time setup: in repo `Settings -> Pages`, set
        # `Source: GitHub Actions`. `enablement: true` is not used here
        # because creating the Pages site requires admin scope which the
        # default `GITHUB_TOKEN` doesn't have, even with `pages: write`.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
