name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'examples/**'
      - 'docs/**'
      - 'scripts/extract-api/**'
      - 'poli-page.gemspec'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'CHANGELOG.md'
      - 'MIGRATION.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

# Pages deploy needs `pages: write` and OIDC `id-token: write`.
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent overlapping deploys; queue the latest commit and keep main
# always reflecting HEAD on Pages.
concurrency:
  group: pages
  cancel-in-progress: false

# All third-party Actions pinned to 40-char commit SHAs.

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Ruby (for the YARD extractor)
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Set up Node (for Astro)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install docs deps
        working-directory: docs
        run: npm ci || npm install --no-audit --no-fund

      - name: Build docs site (YARD extract + astro build)
        working-directory: docs
        run: npm run build

      - name: Verify index exists
        run: test -s docs/dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
