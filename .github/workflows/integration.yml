name: Integration

# Hits the live API. Gated by `secrets.POLI_PAGE_API_KEY`: a `pp_sandbox_`
# key of an organization whose `getting-started` project is untouched (the
# specs render `getting-started`/`welcome` by default). Without the secret
# the job logs a skip and succeeds.
#
# Override the SDK's default API host via `secrets.POLI_PAGE_TEST_BASE_URL`;
# unset, the SDK default applies. The optional repo variables
# POLI_PAGE_TEST_PROJECT / POLI_PAGE_TEST_TEMPLATE override the fixture.

on:
  schedule:
    # Nightly at 04:23 UTC. Off-the-hour to dodge scheduler peaks.
    - cron: "23 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# All third-party Actions pinned to 40-char commit SHAs per
# sdk-ruby-plan.md §16.6.

jobs:
  integration:
    name: RSpec (integration)
    runs-on: ubuntu-latest
    # Skip on forks / PRs without secret access; the secret is empty there.
    if: github.event_name != 'push' || github.repository_owner == 'poli-page'
    env:
      INTEGRATION: "1"
      # The coverage floor in spec_helper.rb is for the full suite (ci.yml);
      # the integration specs alone cannot reach it.
      SIMPLECOV_NO_FAIL: "1"
      POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
      POLI_PAGE_TEST_BASE_URL: ${{ secrets.POLI_PAGE_TEST_BASE_URL }}
      POLI_PAGE_TEST_PROJECT: ${{ vars.POLI_PAGE_TEST_PROJECT }}
      POLI_PAGE_TEST_TEMPLATE: ${{ vars.POLI_PAGE_TEST_TEMPLATE }}
    steps:
      - name: Check secret presence
        id: secret
        # GHA can't reference secrets in a job-level `if`, so we surface
        # presence as a step output and gate the expensive steps below.
        run: |
          if [ -n "${POLI_PAGE_API_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "POLI_PAGE_API_KEY not set; skipping integration run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secret.outputs.present == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Ruby
        if: steps.secret.outputs.present == 'true'
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1.313.0
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Bundle install (frozen)
        if: steps.secret.outputs.present == 'true'
        run: |
          bundle config set --local frozen true
          bundle install

      - name: RSpec (integration)
        if: steps.secret.outputs.present == 'true'
        # An unset secret or variable reaches the job as an empty string, which
        # the specs would take as a value (base URL "", project ""). Unset the
        # empty ones so the SDK default and the getting-started fixture apply.
        shell: bash
        run: |
          for name in POLI_PAGE_TEST_BASE_URL POLI_PAGE_TEST_PROJECT POLI_PAGE_TEST_TEMPLATE; do
            if [ -z "${!name}" ]; then unset "$name"; fi
          done
          bundle exec rspec spec/integration
