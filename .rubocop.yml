plugins:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    - "doc/**/*"
    - "docs/**/*"
    - "coverage/**/*"
    - "pkg/**/*"
    - "examples/**/*"
    - "scripts/**/*"

# Documentation will be enforced via YARD --fail-on-warning in CI from Phase 6.
Style/Documentation:
  Enabled: false

# Double-quoted strings are the dominant convention in modern Ruby SDKs
# (anthropic-sdk-ruby, stripe-ruby, openai-ruby) and match every code example
# in sdk-ruby-plan.md. Cheap, no interpolation cost.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Allow both standard and table-aligned hash rocket styles. The gemspec metadata
# hash uses table alignment for readability; resource maps may use either.
Layout/HashAlignment:
  EnforcedHashRocketStyle:
    - key
    - table
  EnforcedColonStyle:
    - key
    - table

# Idiomatic SDK-style ASCII art and prose in comments are fine.
Style/AsciiComments:
  Enabled: false

# Allow longer methods/classes in spec files and resource classes.
Metrics/MethodLength:
  Max: 25
  Exclude:
    - "spec/**/*"
    - "Rakefile"
    - "poli-page.gemspec"

Metrics/ClassLength:
  # `Client` is the documented public-surface entry point — most of its
  # length is YARD docstrings + the constructor; the actual method count
  # is small. Specs are excluded outright.
  Max: 120
  Exclude:
    - "spec/**/*"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "Rakefile"
    - "poli-page.gemspec"

Layout/LineLength:
  Max: 120
  Exclude:
    - "poli-page.gemspec"

# RSpec cops — the rubocop-rspec defaults are mostly sensible. A few overrides:
RSpec/ExampleLength:
  Max: 15

# Spec parity ports from the Node SDK group multiple expectations per example
# to keep the 1:1 mapping legible — see spec/poli_page/internal/http_spec.rb
# (ported from sdk-node/tests/internal/http.test.ts).
RSpec/MultipleExpectations:
  Max: 8

RSpec/NestedGroups:
  Max: 5

# Several spec files split a single subject across logically distinct
# top-level groups (e.g. errors_spec covers both `Error` and `ErrorCodes`).
RSpec/MultipleDescribes:
  Enabled: false

# Spec file paths mirror the lib/ source organisation (e.g. models live under
# spec/poli_page/models/ matching lib/poli_page/models/), not the bare class
# namespace. The default rule conflicts with that — disable.
RSpec/SpecFilePathFormat:
  Enabled: false

# Integration specs describe end-to-end behaviour against the deployed API,
# not a specific class. They also use before(:all)/after(:all) to scope
# the WebMock toggle to the whole describe block.
RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"

RSpec/BeforeAfterAll:
  Exclude:
    - "spec/integration/**/*"

# The retry-loop tests stub `sleep` on the subject under test — there is no
# cleaner way to assert sleep-duration semantics without actually sleeping
# in CI. Acceptable: `sleep` is `Kernel#sleep`, not an SDK collaborator.
RSpec/SubjectStub:
  Exclude:
    - "spec/poli_page/client_spec.rb"
    - "spec/poli_page/client_get_delete_spec.rb"

# Public SDK methods deliberately take many keyword arguments — every render
# input field is its own kwarg by spec design (sdk-ruby-plan.md §9.1). The
# default cap of 5 is too low; raise to 12, and exempt optional kwargs.
Metrics/ParameterLists:
  Max: 12
  MaxOptionalParameters: 12
  CountKeywordArgs: true
